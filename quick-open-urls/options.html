<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title data-i18n="optionsTitle"></title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 0; padding: 2rem; }
    .container { max-width: 700px; margin: 0 auto; background: white; border-radius: 1rem; padding: 2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    h1 { font-size: 1.8rem; margin-top: 0; }
    .section { margin-bottom: 1.8rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1.2rem; }
    .section h2 { font-size: 1.2rem; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
    .option { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
    label { cursor: pointer; }
    select { padding: 0.3rem 0.8rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; background: white; }
    button { background: #0f172a; color: white; border: none; border-radius: 2rem; padding: 0.5rem 1.2rem; cursor: pointer; }
    button:hover { background: #1e293b; }
    .info { background: #eef2ff; padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 0.85rem; color: #1e40af; margin-top: 0.5rem; }
    .status { margin-top: 1rem; color: #2b6e3c; }
    hr { margin: 1rem 0; }
  </style>
</head>
<body>
<div class="container">
  <h1>⚙️ Quick-Open-URLs - Settings</h1>
  <p data-i18n="welcomeText"></p>

  <div class="section">
    <h2 data-i18n="sectionBehavior"></h2>
    <div class="option"><input type="checkbox" id="lazyLoad" data-i18n-title="lazyLoadLabel"> <label data-i18n="lazyLoadLabel"></label></div>
    <div class="option"><input type="checkbox" id="random" data-i18n-title="randomLabel"> <label data-i18n="randomLabel"></label></div>
    <div class="option"><input type="checkbox" id="reverse" data-i18n-title="reverseLabel"> <label data-i18n="reverseLabel"></label></div>
    <div class="option"><input type="checkbox" id="deduplicate" data-i18n-title="deduplicateLabel"> <label data-i18n="deduplicateLabel"></label></div>
    <div class="option"><input type="checkbox" id="searchQuery" data-i18n-title="searchQueryLabel"> <label data-i18n="searchQueryLabel"></label></div>
  </div>

  <div class="section">
    <h2 data-i18n="sectionTabGroup"></h2>
    <div class="option"><select id="tabGroupSelect"></select></div>
    <div class="info" data-i18n="tabGroupInfo"></div>
  </div>

  <div class="section">
    <h2 data-i18n="sectionContainer"></h2>
    <div class="option"><select id="containerSelect"></select></div>
    <div class="info" data-i18n="containerInfo"></div>
  </div>

  <div class="section">
    <h2 data-i18n="sectionShortcuts"></h2>
    <div class="option">
      <button id="manageShortcuts" data-i18n="manageShortcutsButton"></button>
    </div>
    <div class="info" data-i18n="shortcutsInfo"></div>
  </div>

  <hr>
  <div class="option">
    <button id="save" data-i18n="saveButton"></button>
    <span id="saveStatus" class="status"></span>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
